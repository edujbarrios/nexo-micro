name: Publish Python distributions to PyPI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    # Owner approval on GitHub Release is required; pre-releases do not publish.
    if: github.event.release.prerelease == false && github.event.release.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and test tools
        run: python -m pip install -e '.[dev]'
      - name: Match release tag and package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          from nexo_micro import __version__
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert __version__ == version, 'package / module versions disagree'
          assert os.environ['TAG'] == f'v{version}', 'release tag must match package version'
          PY
      - run: python -m pytest -q
      - run: ruff check src tests examples
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify built wheel install
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Check installed import
        working-directory: /tmp
        run: python -c 'import nexo_micro; print(nexo_micro.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
  publish:
    name: Publish on PyPI via OIDC
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
