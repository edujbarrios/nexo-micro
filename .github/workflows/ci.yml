name: CI - tests, build and token benchmarks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests examples
      - name: Synthetic UTF-8 benchmark (not model tokens)
        if: matrix.python-version == '3.12'
        run: python -m nexo_micro bench --bytes-only --repeats 100 > benchmark-bytes.json
      - name: Real tokenizer counts - o200k_base
        if: matrix.python-version == '3.12'
        run: python -m nexo_micro bench --encoding o200k_base --repeats 100 > benchmark-o200k.json
      - name: Real tokenizer counts - cl100k_base
        if: matrix.python-version == '3.12'
        run: python -m nexo_micro bench --encoding cl100k_base --repeats 100 > benchmark-cl100k.json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: synthetic-tokenizer-benchmarks
          path: benchmark-*.json
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel outside source tree
        working-directory: /tmp
        run: python -c 'import nexo_micro; from nexo_micro import MicroSession; assert MicroSession().encode({"task":42,"intent":"status"}) == "@16|?"'
      - uses: actions/upload-artifact@v4
        with:
          name: validated-distributions
          path: dist/*
